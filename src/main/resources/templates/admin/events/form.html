<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Mario Fotografo - Evento</title>
	<link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
	<div th:replace="~{fragments/header :: header}"></div>
	<main class="contenitore">
		<span class="sopratitolo">Amministrazione</span>
		<h1 class="titolo-forte" th:text="${event.id == null} ? 'Nuovo evento' : 'Modifica evento'">Evento</h1>

		<div class="blocco blocco-stretto">
			<form class="modulo" th:action="@{/admin/events}" method="POST" th:object="${event}">
				<input type="hidden" th:field="*{id}" />
				<div class="campo">
					<label>Titolo</label>
					<input type="text" th:field="*{title}" placeholder="es. Matrimonio di Anna e Marco" />
					<span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
				</div>
				<div class="campo">
					<label>Tipo</label>
					<select th:field="*{type}">
						<option value="">Seleziona il tipo</option>
						<option th:each="t : ${types}" th:value="${t}" th:text="#{${'type.' + t}}">tipo</option>
					</select>
					<span class="error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></span>
				</div>
				<div class="campo">
					<label>Data</label>
					<input type="date" th:field="*{date}" />
					<span class="error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></span>
				</div>
				<div class="campo">
					<label>Luogo</label>
					<input type="text" th:field="*{location}" placeholder="es. Frascati (RM)" />
					<span class="error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></span>
				</div>
				<div class="campo">
					<label>Descrizione</label>
					<textarea th:field="*{description}"></textarea>
					<span class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
				</div>
				<div class="campo">
					<label>Prezzo del pacchetto completo (&euro;)</label>
					<input type="number" step="10" min="0" th:field="*{price}" />
					<span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
				</div>
				<div class="azioni">
					<button type="submit">Salva</button>
					<a class="bottone bottone-secondario" href="/admin/events">Annulla</a>
				</div>
			</form>
		</div>
	</main>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
