<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Mario Fotografo - Amministrazione</title>
	<link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
	<div th:replace="~{fragments/header :: header}"></div>
	<main class="contenitore">
		<span class="sopratitolo">Riservato al fotografo</span>
		<h1 class="titolo-forte">Amministrazione</h1>
		<div class="griglia">
			<div class="blocco">
				<h2>Eventi e foto</h2>
				<p>Crea un evento con il prezzo del suo pacchetto, carica le foto e scegli la copertina.</p>
				<div class="azioni">
					<a class="bottone" href="/admin/events/new">Nuovo evento</a>
					<a class="bottone bottone-secondario" href="/admin/events">Tutti gli eventi</a>
				</div>
			</div>
			<div class="blocco">
				<h2>Ordini</h2>
				<p>Guarda i pacchetti ordinati dai clienti e segna quelli consegnati.</p>
				<div class="azioni">
					<a class="bottone" href="/admin/purchases">Tutti gli ordini</a>
				</div>
			</div>
		</div>
	</main>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
